server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits the pdf.js worker as .mjs — nginx's default mime.types
    # maps it to application/octet-stream, which browsers reject for
    # module scripts. A `types {}` block REPLACES the default table, so
    # list every type this app serves.
    types {
        application/javascript  js mjs;
        text/css                css;
        text/html               html;
        image/svg+xml           svg;
        image/png               png;
        image/x-icon            ico;
        application/json        json webmanifest;
        font/woff2              woff2;
    }

    # Static assets are content-hashed by Vite — cache aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (HashRouter keeps routes in the fragment, but be safe)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching for the entry point
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
