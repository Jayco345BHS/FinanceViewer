server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed by Vite — cache aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (HashRouter keeps routes in the fragment, but be safe)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching for the entry point
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
